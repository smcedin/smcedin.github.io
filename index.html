    <title>EDIN PORTFOLIO</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        header {
            background-color: #FFFFFF;
            color: #000000;
            padding: 20px;
        }
    </style>
</head>
    
<body>

<header class="ticker-wrapper">
  <div class="ticker-track">
    <span>EDIN&nbsp;&nbsp;EDIN&nbsp;&nbsp;EDIN&nbsp;&nbsp;EDIN&nbsp;&nbsp;EDIN&nbsp;&nbsp;EDIN&nbsp;&nbsp;EDIN&nbsp;&nbsp;EDIN&nbsp;&nbsp;EDIN&nbsp;&nbsp;EDIN&nbsp;&nbsp;EDIN&nbsp;&nbsp;EDIN&nbsp;&nbsp;EDIN&nbsp;&nbsp;EDIN&nbsp;&nbsp;EDIN&nbsp;&nbsp;EDIN&nbsp;&nbsp;EDIN&nbsp;&nbsp;EDIN&nbsp;&nbsp;</span>

  </div>
</header>

<style>
.ticker-wrapper {
  width: 100%;
  overflow: hidden;
  background: #fff;
}

.ticker-track {
  display: flex;
  width: max-content;
  animation: scroll 10s linear infinite;
}

.ticker-track span {
  font-size: 1rem;
  white-space: nowrap;
}

@keyframes scroll {
  0% {
    transform: translateX(0);
  }
  100% {
    transform: translateX(-50%);
  }
}
</style>
    
    <style>
